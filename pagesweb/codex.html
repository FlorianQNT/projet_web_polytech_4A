<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Hades Database Viewer</title>
    <style>
        body { background-color: #1a1a1a; color: #f0f0f0; font-family: sans-serif; padding: 20px; }
        
        .header-container { text-align: center; margin-bottom: 20px; }
        
        /* Style du Logo dans le titre */
        .site-logo {
            height: 60px;
            vertical-align: middle;
            margin-right: 15px;
        }

        h1 { color: #e74c3c; display: inline-block; vertical-align: middle; margin: 0; }
        
        /* Modif pour le conteneur de liens retour */
        .nav-top {
            margin-bottom: 20px;
        }
        .back-link {
            color: #999;
            text-decoration: none;
            font-size: 0.9rem;
            margin-right: 20px;
            transition: color 0.2s;
        }
        .back-link:hover { color: #fff; text-decoration: underline; }

        /* Le Formulaire */
        .search-box { text-align: center; margin-bottom: 30px; background: #333; padding: 20px; border-radius: 10px; }
        select, button { padding: 10px; font-size: 16px; border-radius: 5px; border: none; }
        button { background-color: #e74c3c; color: white; cursor: pointer; margin-left: 10px;}
        button:hover { background-color: #c0392b; }

        /* Le Tableau */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #2c2c2c; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #444; }
        th { background-color: #e74c3c; color: white; text-transform: capitalize; }
        tr:hover { background-color: #3a3a3a; }
        
        /* Les Images dans le tableau */
        .table-img { width: 64px; height: 64px; object-fit: contain; background: #000; border-radius: 5px; }
        
        #message { text-align: center; margin-top: 20px; color: orange; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="nav-top">
        <a href="accueil.html" class="back-link">&larr; Retour à l'accueil</a>
        <a href="build.html" class="back-link">Aller au Planificateur &rarr;</a>
    </div>

    <div class="header-container">
        <h1>
            <img src="Hades_symbol_II.webp" alt="Logo" class="site-logo">
            Archives des Enfers
        </h1>
    </div>

    <div class="search-box">
        <label>Que voulez-vous consulter ?</label>
        <select id="categorieSelect">
            <option value="" disabled selected>-- Choisissez une catégorie --</option>
            
            <optgroup label="Équipement">
                <option value="armes">Les Armes Infernales</option>
                <option value="marteaux">Marteaux de Dédale</option>
                <option value="miroir_total">Miroir de la Nuit</option>
            </optgroup>

            <optgroup label="Bienfaits des Dieux">
                <option value="aphrodite">Aphrodite</option>
                <option value="ares">Arès</option>
                <option value="artemis">Artémis</option>
                <option value="athena">Athéna</option>
                <option value="demeter">Demeter</option>
                <option value="dionysos">Dionysos</option>
                <option value="hermes">Hermès</option>
                <option value="poseidon">Poséidon</option>
                <option value="zeus">Zeus</option>
                <option value="duo">Duo Boons</option>
            </optgroup>
        </select>
		
		<select id="armeTypeSelect" style="display:none; margin-left: 10px;">
            <option value="">-- Toutes les armes --</option>
            <option value="Epée">Épée</option>
            <option value="Lance">Lance</option>
            <option value="Bouclier">Bouclier</option>
            <option value="Arc">Arc</option>
            <option value="Poings">Poings</option>
            <option value="Canon">Canon</option>
        </select>
        <button id="btnSearch">Afficher</button>
    </div>

    <div id="tableContainer"></div>
    <p id="message"></p>

    <script>
		const catSelect = document.getElementById('categorieSelect');
        const armeSelect = document.getElementById('armeTypeSelect');

        catSelect.addEventListener('change', function() {
            if (this.value === 'marteaux') {
                armeSelect.style.display = 'inline-block';
            } else {
                armeSelect.style.display = 'none';
                armeSelect.value = ""; // On remet à zéro si on change de catégorie
            }
        });
		const baseUrl = "https://raw.githubusercontent.com/FlorianQNT/projet_web_polytech_4A/main/images/";
        document.getElementById('btnSearch').addEventListener('click', function() {
            const categorie = document.getElementById('categorieSelect').value;
			const sousType = document.getElementById('armeTypeSelect').value;
            const container = document.getElementById('tableContainer');
            const message = document.getElementById('message');

            if (!categorie) {
                message.textContent = "Veuillez choisir une catégorie.";
                return;
            }

            container.innerHTML = '';
            message.textContent = 'Chargement des archives...';
			
			let url = `api.php?categorie=${categorie}`;
            if (categorie === 'marteaux' && sousType) {
                url += `&type=${sousType}`;
            }

            fetch(url) // On utilise la variable 'url' modifiée
                .then(response => response.json())
                .then(data => {
                    message.textContent = ''; 

                    if (data.error) {
                        message.textContent = data.error;
                        return;
                    }

                    if (data.length === 0) {
                        message.textContent = "Aucune donnée trouvée pour cette catégorie.";
                        return;
                    }

                    let html = '<table><thead><tr>';
                    
                    let keys = Object.keys(data[0]);

					// 2. On cherche si la colonne "Image" existe
					const imgIndex = keys.findIndex(k => k.toLowerCase() === 'image');

					// 3. Si elle existe, on la déplace au tout début du tableau
					if (imgIndex > -1) {
						const imgKey = keys.splice(imgIndex, 1)[0]; // On l'enlève de sa position actuelle
						keys.unshift(imgKey); // On l'ajoute au début (index 0)
					}

					// ---------------------------------------------------

					// Génération des En-têtes (Headers)
					keys.forEach(key => {
						// Optionnel : ne pas afficher le texte "Image" dans l'en-tête pour faire plus propre
						if(key.toLowerCase() === 'image') html += `<th>Icône</th>`; 
						else html += `<th>${key}</th>`;
					});
					html += '</tr></thead><tbody>';

					// Génération des Lignes (Rows)
					data.forEach(row => {
						html += '<tr>';
						// On utilise le tableau 'keys' réorganisé pour afficher les cellules dans le bon ordre
						keys.forEach(key => {
							let value = row[key];

							// 1. Gestion des IMAGES
							if (key.toLowerCase() === 'image' && value) {
								html += `<td><img src="${baseUrl}${value}" alt="Img" class="table-img"></td>`;
							} 
							// 2. Gestion des PRÉREQUIS (Nouveau !)
							// On vérifie si le nom de la colonne contient "prerequi" (marche pour Prérequis, Prerequi, etc.)
							else if ((key.toLowerCase().includes('prerequi') || key.toLowerCase().includes('prérequi')) && value) {
    
								let formattedValue = value.toString();

								// --- MODIFICATION ICI : Traitement spécial pour les DUOS ---
								if (categorie === 'duo') {
									// 1. On transforme la chaîne en tableau en coupant aux points-virgules
									// 2. On filtre pour supprimer les éléments qui sont strictement égaux à "Aucun" (ou "aucun")
									// 3. On recolle les éléments restants avec des sauts de ligne <br>
									formattedValue = formattedValue.split(';')
										.filter(item => item.trim().toLowerCase() !== 'aucun') 
										.join('<br>');
								} 
								else {
									// Pour les autres catégories (Aphrodite, Zeus...), on garde le comportement normal
									// (On affiche "Aucun" si c'est le seul prérequis, car c'est une information utile)
									formattedValue = formattedValue.replace(/;/g, '<br>');
								}
								
								html += `<td style="white-space: nowrap;">${formattedValue}</td>`;
							}
							// 3. Gestion des TEXTES NORMAUX
							else {
								html += `<td>${value !== null ? value : ''}</td>`;
							}
						});
						html += '</tr>';
					});

					html += '</tbody></table>';
					container.innerHTML = html;
				})

                .catch(error => {
                    console.error('Erreur:', error);
                    message.textContent = "Erreur de communication avec le serveur (Vérifiez la console).";
                });
        });
    </script>

</body>
</html>
